<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<body>
    <header>
        <div class="container">
            <h1>JobTrack</h1>
            <p>Esto es un ejemplo de una breve descripcion de texto sobre JobTrack </p>
        </div>
    </header>

    <main class="container">
        <section id="formulario">
            <h2>Nueva Oportunidad</h2>
            <form>
                <div class="form-group">
                    <label for="puesto">Puesto</label>
                    <input type="text" id="puesto" name="puesto">
                </div>
                
                <div class="form-group">
                    <label for="empresa">Empresa</label>
                    <input type="text" id="empresa" name="empresa">
                </div>
                
                <div class="form-group">
                    <label for="fecha">Fecha de candidatura:</label>
                    <input type="date" id="fecha" name="fecha">
                </div>
                
                <div class="form-group">
                    <label for="estado">Estado</label>
                    <select id="estado" name="estado">
                        <option value="guardada">Guardada</option>
                        <option value="enviada">Enviada</option>
                        <option value="entrevista">Entrevista</option>
                        <option value="oferta">Oferta</option>
                        <option value="cerrada">Cerrada</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="enlace">Enlace de la oferta</label>
                    <input type="url" id="enlace" name="enlace">
                </div>
                
                <div class="form-group">
                    <label for="next">Proximo seguimiento</label>
                    <input type="date" id="next" name="next">
                </div>

                <button id="guardar-candidatura" type="submit">
                  Guardar candidatura
                </button>
            </form>
        </section>

        <section id="oportunidades">
            <h2>Oportunidades</h2>
